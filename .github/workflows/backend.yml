name: Backend

# Only when the integration or its tests change (or run by hand). One Python
# on push; both supported versions when run by hand (before a release).
on:
  push:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "requirements_test.txt"
      - ".github/workflows/backend.yml"
  # (a contributor's pull request: the same checks, before it's reviewed)
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "requirements_test.txt"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["3.13", "3.14"]') || fromJSON('["3.14"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest -q
