name: Release

# A published release: every board's panel firmware and the dashboard built
# (firmware.yml, frontend.yml), then attached to the release:
# - room_tiles.zip - what the Marketplace installs (hacs.json zip_release):
#   the integration with its dashboard and every board's update image, so
#   one install / update brings the panels' firmware with it
#   (tools/make_release_zip.py; manifest.json's version = the tag);
# - each board's factory image (the first USB install, by hand).
# - candy.zip - the example theme (examples/themes/candy), ready for the
#   dashboard's "Add a theme from a link" (releases/latest/download/candy.zip).
# Then the GitHub Pages site (site.yml): the landing page, the demo, the
# gallery and the install page (Settings > Pages > Source "GitHub Actions").
on:
  release:
    types: [published]

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml

  frontend:
    uses: ./.github/workflows/frontend.yml

  package:
    needs: [firmware, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # (the boards' artifacts are named after their device files: room-tiles-*)
      - uses: actions/download-artifact@v4
        with:
          pattern: room-tiles-*
          path: images
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: dashboard
      - name: The HACS zip
        run: python3 tools/make_release_zip.py images dashboard "${{ github.event.release.tag_name }}" room_tiles.zip
      - name: The example theme
        run: (cd examples/themes && zip -qr ../../candy.zip candy)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" room_tiles.zip candy.zip images/*.factory.bin --repo "${{ github.repository }}" --clobber

  # the GitHub Pages site - the landing page, the demo, the gallery and the
  # install page with this release's factory images (site.yml)
  site:
    needs: firmware
    uses: ./.github/workflows/site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
