# Elecrow CrowPanel 2.1" round ESP32-S3: 480x480 ST7701S (RGB), CST826 touch,
# a rotary knob with a press, a PCF8574 IO expander (power and resets).
# Hardware only; Room Tiles itself is in room_tiles.yaml - the round layout
# (room_tiles: layout: strip, map: false) is set here.
# Pins and the screen's init sequence: from a working ESPHome project on this
# display (Elecrow's sample code). Touch: ESPHome's cst816 (it knows the
# CST826, ID read from the factory register).

esphome:
  # (a LIST: packages add lists together)
  on_boot:
    # the screen's power, then its and the touch controller's reset - before
    # the display is set up
    - priority: 800
      then:
        - output.turn_on: rt_lcd_power
        - output.turn_on: rt_lcd_reset
        - delay: 100ms
        - output.turn_off: rt_lcd_reset
        - delay: 100ms
        - output.turn_on: rt_tp_reset
        - delay: 100ms
        - output.turn_off: rt_tp_reset
        - delay: 120ms
        - output.turn_on: rt_tp_reset
        - delay: 120ms
        - output.turn_on: rt_tp_intr

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  partitions: room_tiles/partitions_s3_16mb.csv
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      # run from PSRAM (code and constants): writing flash (a theme pack, an
      # update) then doesn't pause the RGB screen's picture
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

# the board's shape and what this firmware leaves out (no map, no vacuum view)
room_tiles:
  board: elecrow-s3-round-2.1
  layout: strip
  map: false

i2c:
  - id: bus_touch
    sda: GPIO38
    scl: GPIO39
    frequency: 400kHz
    scan: true

pcf8574:
  - id: rt_io
    i2c_id: bus_touch
    address: 0x21

# the IO expander: P0 touch reset, P2 touch interrupt, P3 screen power, P4
# screen reset, P5 the knob's press
output:
  - platform: gpio
    id: rt_lcd_power
    pin: {pcf8574: rt_io, number: 3, mode: {output: true}}
  - platform: gpio
    id: rt_tp_reset
    pin: {pcf8574: rt_io, number: 0, mode: {output: true}}
  - platform: gpio
    id: rt_lcd_reset
    pin: {pcf8574: rt_io, number: 4, mode: {output: true}, inverted: true}
  - platform: gpio
    id: rt_tp_intr
    pin: {pcf8574: rt_io, number: 2, mode: {output: true}}
  - platform: ledc
    pin: GPIO6
    id: rt_backlight_pwm
    frequency: 19531Hz

light:
  - platform: monochromatic
    name: "Backlight"
    output: rt_backlight_pwm
    id: rt_backlight
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    entity_category: config
    on_turn_off:
      - lambda: id(rt).backlight_switched(false);
    on_turn_on:
      - lambda: id(rt).backlight_switched(true);

spi:
  clk_pin: GPIO2
  mosi_pin: GPIO1

display:
  - platform: st7701s
    id: rt_display
    update_interval: never
    auto_clear_enabled: false
    show_test_card: false
    spi_mode: MODE3
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: GPIO16
    de_pin: GPIO40
    hsync_pin: GPIO15
    vsync_pin: GPIO7
    pclk_pin: GPIO41
    data_pins:
      red: [GPIO46, GPIO3, GPIO8, GPIO18, GPIO17]
      green: [GPIO14, GPIO13, GPIO12, GPIO11, GPIO10, GPIO9]
      blue: [GPIO5, GPIO45, GPIO48, GPIO47, GPIO21]
    hsync_front_porch: 20
    hsync_pulse_width: 10
    hsync_back_porch: 10
    vsync_front_porch: 8
    vsync_pulse_width: 10
    vsync_back_porch: 10
    pclk_frequency: 18MHz
    pclk_inverted: true
    init_sequence:
      - [0x01]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCC, 0x10]
      - [0xCD, 0x08]
      - [0xB0, 0x02, 0x13, 0x1B, 0x0D, 0x10, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xB1, 0x05, 0x13, 0x1B, 0x0D, 0x11, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x5D]
      - [0xB1, 0x43]
      - [0xB2, 0x81]
      - [0xB3, 0x80]
      - [0xB5, 0x43]
      - [0xB7, 0x85]
      - [0xB8, 0x20]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xD0, 0x88]
      - [0xE0, 0x00, 0x00, 0x02]
      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20]
      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x00]
      - [0xE4, 0x22, 0x00]
      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE6, 0x00, 0x00, 0x11, 0x00]
      - [0xE7, 0x22, 0x00]
      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]
      - [0xED, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF]
      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]
      - [0x36, 0x00]
      - [0x3A, 0x60]
      - [0x11]
      - delay 100ms
      - [0x29]
      - delay 50ms

touchscreen:
  platform: cst816
  id: rt_touchscreen
  i2c_id: bus_touch
  address: 0x15
  skip_probe: true
  update_interval: 25ms
  on_touch:
    - lambda: "id(rt_last_touch_ms) = millis();"

# the knob: a turn scrolls the strip half a tile a click (more a click when
# turned fast), a press taps the centered tile (room_tiles.cpp knob_turn /
# knob_press)
sensor:
  - platform: rotary_encoder
    id: rt_knob
    pin_a: {number: GPIO42, mode: {input: true, pullup: true}}
    pin_b: {number: GPIO4, mode: {input: true, pullup: true}}
    resolution: 1
    internal: true
    on_clockwise:
      - lambda: id(rt).knob_turn(1);
    on_anticlockwise:
      - lambda: id(rt).knob_turn(-1);

binary_sensor:
  - platform: gpio
    id: rt_knob_press
    internal: true
    pin: {pcf8574: rt_io, number: 5, mode: {input: true}, inverted: true}
    on_press:
      - lambda: id(rt).knob_press();
