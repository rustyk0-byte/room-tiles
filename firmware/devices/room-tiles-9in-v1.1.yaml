# Room Tiles - the generic image for an Elecrow CrowPanel Advanced 9"
# ESP32-P4 with "V1.1" printed on its board. Nothing about one panel or home
# inside (identity/generic.yaml). BETA: not tried on a 9" yet - built like the 10.1" (Elecrow: the 7",
# 9" and 10.1" share their hardware and code; the 9" switches its backlight's
# power like the 10.1" - elecrow-p4-10in.yaml). Its Wi-Fi chip link runs at 20 MHz to be safe
# (boards/elecrow-p4.yaml). tools/sync-firmware.sh copies this file
# into the ESPHome config folder beside room_tiles/.
# The chip's revision is a substitution so CI can build both from one file
# (esphome -s engineering_sample false ...): see the vars below.
substitutions:
  engineering_sample: "true"

packages:
  board: !include
    file: room_tiles/boards/elecrow-p4.yaml
    vars:
      board_rev: "1.1"
      # The chip's own revision - NOT printed on the board: esptool says
      # "ESP32-P4 (revision v1.x)" = true (an engineering sample - every
      # board so far), "v3.x" or later = false. Wrong = "Illegal instruction"
      # right at boot. The install page will read it from the chip itself.
      engineering_sample: ${engineering_sample}
      # (the screen's rail at the full supply, as Elecrow's own code runs it)
      ldo4_voltage: passthrough
      board_size: 9in
  # the 9" and 10.1": the backlight's power switch, the screen's VCOM buffer,
  # the touch tuning
  board_large: !include room_tiles/boards/elecrow-p4-10in.yaml
  identity: !include room_tiles/identity/generic.yaml
  room_tiles: !include room_tiles/room_tiles.yaml
