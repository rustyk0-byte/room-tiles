<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Room Tiles demo</title>
  <meta name="description" content="Try the Room Tiles dashboard on a made-up home, right in your browser.">
  <style>
    :root { --bar: 40px; --bar-bg: #1c1c1e; --bar-text: #f2f2f2; --bar-soft: #a8a8ad; --flash: #4b9ef3; }
    html, body { margin: 0; height: 100%; background: #111; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #demo-note {
      position: fixed; inset: 0 0 auto 0; height: var(--bar); box-sizing: border-box;
      display: flex; align-items: center; gap: 12px; padding: 0 16px;
      background: var(--bar-bg); color: var(--bar-text); font-size: 14px; z-index: 10;
      transition: background-color 0.3s;
    }
    #demo-note .soft { color: var(--bar-soft); }
    #demo-note .saved { display: none; }
    #demo-note.flash { background: var(--flash); }
    #demo-note.flash .saved { display: inline; }
    #demo-note.flash .soft { display: none; }
    #demo-note a { color: inherit; margin-left: auto; white-space: nowrap; }
    /* the dashboard in a window of its own (app.html): it fills one, like a
       panel in Home Assistant - its bars and dialogs stay under this bar */
    #demo-app { position: fixed; inset: var(--bar) 0 0 0; width: 100%; height: calc(100% - var(--bar)); border: 0; display: block; }
    @media (max-width: 520px) { #demo-note .soft { display: none; } }
  </style>
</head>
<body>
  <div id="demo-note" role="status">
    <strong>Room Tiles demo</strong>
    <span class="soft">A made-up home. Tap away - nothing is saved.</span>
    <span class="saved">Changes aren't saved in the demo.</span>
    <a href="https://github.com/rustyk0-byte/room-tiles">Get Room Tiles</a>
  </div>
  <iframe id="demo-app" src="app.html" title="Room Tiles dashboard (demo)"></iframe>
  <script>
    // the dashboard says when an edit wasn't saved (demo.ts): flash the bar
    const note = document.getElementById("demo-note");
    let timer;
    addEventListener("message", (e) => {
      if (e.origin !== location.origin || e.data !== "room-tiles-demo:unsaved") return;
      note.classList.add("flash");
      clearTimeout(timer);
      timer = setTimeout(() => note.classList.remove("flash"), 1600);
    });
  </script>
</body>
</html>
